name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

jobs:
  ai-hot-comments:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-hot-comments-render-oneclick-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai-hot-comments-render-oneclick-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check src/server.js

      - name: Run tests
        run: npm test
